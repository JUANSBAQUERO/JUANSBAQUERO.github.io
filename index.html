<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Juan Sebastián Baquero — Senior Full Stack Developer</title>
<meta name="description" content="Interactive 3D scroll portfolio of Juan Sebastián Baquero Moreno, Senior Full Stack Developer.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/presentation/styles/main.css">
</head>
<body>

<div id="journey-stage">
  <div class="stage-loader" id="stageLoader"><div class="stage-loader__ring"></div></div>
</div>

<nav id="navPill" class="nav-pill"></nav>
<button id="navToggle" class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
  <span class="nav-toggle__bar"></span>
  <span class="nav-toggle__bar"></span>
  <span class="nav-toggle__bar"></span>
</button>
<div class="top-right-controls">
  <div class="locale-switcher" id="localeSwitcher">
    <button class="locale-switcher__item" data-locale="en" type="button">EN</button>
    <button class="locale-switcher__item" data-locale="es" type="button">ES</button>
  </div>
  <button class="nav-cta" id="navCta" type="button"></button>
</div>

<main id="scrollRoot">

  <section class="beat" id="beat-hero" data-beat="hero">
    <div class="beat-card beat-card--center">
      <div class="eyebrow" id="heroEyebrow"></div>
      <h1 id="heroGreeting"></h1>
      <div class="hero-availability" id="heroAvailability"></div>
      <h2 class="hero-subtitle" id="heroSubtitle"></h2>
      <p id="heroBody"></p>
      <div class="scroll-hint" id="heroScrollHint"></div>
    </div>
  </section>

  <section class="beat" id="beat-about" data-beat="about">
    <div class="beat-card">
      <div class="tag-pill" id="aboutTag"></div>
      <div id="tcAboutName" class="beat-card__identity"></div>
      <div id="tcAboutBody" class="tc-body"></div>
    </div>
  </section>

  <section class="beat" id="beat-experience" data-beat="experience">
    <div class="beat-card beat-card--wide">
      <div class="tag-pill" id="experienceTag"></div>
      <h2 id="experienceHeading"></h2>
      <div class="experience-list" id="experienceList"></div>
    </div>
  </section>

  <section class="beat" id="beat-projects" data-beat="projects">
    <div class="beat-card beat-card--wide">
      <div class="tag-pill" id="projectsTag"></div>
      <h2 id="projectsHeading"></h2>
      <div class="proj-grid proj-grid--wide" id="projectsGrid"></div>
    </div>
  </section>

  <section class="beat" id="beat-skills" data-beat="skills">
    <div class="beat-card beat-card--wide">
      <div class="tag-pill" id="skillsTag"></div>
      <h2 id="skillsHeading"></h2>
      <div class="skills-list" id="skillsList"></div>
    </div>
  </section>

  <section class="beat" id="beat-contact" data-beat="contact">
    <div class="beat-card">
      <h2 id="contactHeading"></h2>
      <div class="contact-list" id="contactList"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <span>© 2026 Juan Sebastián Baquero</span>
  <button class="footer-legal-link" id="legalLink" type="button"></button>
</footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
